[project]
name = "jepa-landscape"
version = "0.1.0"
description = "Versioned, evidence-grounded JEPA research catalogue"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.12,<3", "beautifulsoup4>=4.14,<5", "defusedxml>=0.7,<1"]

[project.scripts]
jepa = "jepa.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jepa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
